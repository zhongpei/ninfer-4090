name: Bootstrap franken v0.11 baseline

on:
  push:
    paths:
      - ".github/workflows/bootstrap-franken.yml"

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import iamwavecut franken/v0.11 into current main
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch franken/v0.11 https://github.com/iamwavecut/ninfer-3090.git "$tmp/upstream"

          # Preserve this bootstrap workflow so the Actions token does not need
          # workflows:write. Everything else is synchronized from upstream.
          rsync -a --delete             --exclude '.git/'             --exclude '.github/workflows/'             "$tmp/upstream/" ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "baseline already imported"
            exit 0
          fi
          git commit -m "chore: import iamwavecut franken/v0.11 baseline"
          git push origin HEAD:main
