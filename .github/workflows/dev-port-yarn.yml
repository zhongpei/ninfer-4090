name: Dev inspect YaRN port

on:
  push:
    paths:
      - ".github/workflows/dev-port-yarn.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v0.11 YaRN wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TextContext construction sites ==='
          git grep -n 'TextContext card' -- src/models/qwen3_5 || true
          echo '=== ExecutionCore aggregate sites ==='
          git grep -n 'ExecutionCore{' -- src/models/qwen3_5 || true
          git grep -n 'prefill_chunk, proposal_head' -- src/models/qwen3_5 || true
          echo '=== YaRN policy references ==='
          git grep -n 'rope_scaling_' -- include src apps scripts || true
          echo '=== position scaling references ==='
          git grep -n 'scale_positions_yarn' -- include src || true
          echo '=== whitespace ==='
          git diff --check HEAD~25..HEAD || true
