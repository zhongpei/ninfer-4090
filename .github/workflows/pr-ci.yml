name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-sm89:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build product targets in the maintained CUDA image
        run: docker build --target build --tag ninfer-pr-ci .

      - name: Compile the affected LinearSwiGLU Q8 conformance target
        run: |
          docker run --rm ninfer-pr-ci bash -lc '
            cmake -S /src -B /build-tests -G Ninja               -DCMAKE_BUILD_TYPE=Release               -DCMAKE_CUDA_ARCHITECTURES=89               -DBUILD_TESTING=ON               -DNINFER_BUILD_APPS=OFF               -DNINFER_BUILD_BENCHMARKS=OFF &&
            cmake --build /build-tests --parallel --target ninfer_linear_swiglu_q8_a16_test
          '

  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run route-report regression
        run: python -m pytest -q tests/report_regression/test_sm89_dflash2_route_sweep.py
